<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Reach SG</title>
<meta name="description" content="Live next-bus timings from your stop, and every stop and MRT station you can reach in 10, 20 and 30 minutes.">
<meta name="theme-color" content="#0f172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f3f4f6; --surface:#fff; --surface-2:#f1f3f6; --text:#0f172a; --muted:#64748b; --line:#e5e7eb;
  --b10:#16a34a; --b20:#eab308; --b30:#f97316; --live:#16a34a;
  --accent:#2563eb; --mrt:#1d4ed8; --mrt-soft:#e8efff; --int:#7c3aed;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121a2e; --surface-2:#1a2440; --text:#e8edf7; --muted:#8b98b3; --line:#243049;
    --b10:#22c55e; --b20:#facc15; --b30:#fb923c; --live:#22c55e;
    --accent:#60a5fa; --mrt:#8bbcff; --mrt-soft:rgba(96,165,250,.14); --int:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface-2:#1a2440; --text:#e8edf7; --muted:#8b98b3; --line:#243049;
  --b10:#22c55e; --b20:#facc15; --b30:#fb923c; --live:#22c55e;
  --accent:#60a5fa; --mrt:#8bbcff; --mrt-soft:rgba(96,165,250,.14); --int:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}

/* ============ base + layout ============ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(320px,34%) minmax(0,1fr);height:100vh;height:100dvh}
.map-wrap{position:relative;min-height:0}
#map{height:100%;background:var(--surface-2)}
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 40px}
.muted{color:var(--muted)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}

/* ============ shared bits ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.svc{-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center;min-width:50px;height:34px;padding:0 8px;border-radius:10px;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em;flex:none}
.svc.sm{min-width:32px;height:20px;border-radius:6px;font-size:11px;padding:0 5px}
.op-SBST{background:#6d28d9}.op-SMRT{background:#dc2626}.op-TTS{background:#059669}.op-GAS{background:#ca8a04}.op-X{background:#475569}
.pill{display:inline-flex;align-items:center;height:16px;font-size:10px;font-weight:700;letter-spacing:.02em;padding:0 5px;border-radius:5px;color:#fff;flex:none}
.pill.int{background:var(--int)}
.tag,.line-h .have{white-space:nowrap;flex:none;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:16px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ============ header ============ */
.hdr{padding:14px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
.hdr-actions{margin-left:auto;display:flex;gap:6px}
.stop-title{display:flex;align-items:center;gap:12px;margin-top:10px}
.code{font-weight:700;font-size:12px;letter-spacing:.03em;background:var(--text);color:var(--surface);padding:4px 7px;border-radius:7px;flex:none}
.stop-name{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stop-sub{font-size:13px;color:var(--muted);margin-top:1px}
.fav{margin-left:auto;color:var(--muted);padding:4px}
.stop-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.schip{display:inline-flex;align-items:center;height:30px;max-width:280px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;transition:border-color .15s}
.schip:hover{border-color:var(--muted)}
.schip>button{display:inline-flex;align-items:center;gap:7px;height:100%;padding:0 10px 0 7px;min-width:0}
.schip i{width:14px;height:14px;border-radius:50%;background:var(--text);border:2px solid var(--text);box-shadow:inset 0 0 0 2px var(--surface);flex:none}
.schip .code{font-size:11px;padding:2px 5px;border-radius:5px}
.schip.off{color:var(--muted);border-style:dashed}
.schip.off i{background:var(--surface);border-color:var(--muted)}
.schip.off .code{background:var(--muted)}
.schip.off .ellip{text-decoration:line-through}
.schip .x{padding:0 10px 0 0;color:var(--muted);font-size:16px;line-height:1}
.schip .x:hover{color:var(--text)}
.schip.add{gap:5px;padding:0 12px;color:var(--accent);border-style:dashed}
.arr-stop{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:13px;font-weight:600}
.arr-stop:first-child{margin-top:0}
.arr-stop .muted{font-weight:500}
.fav.on{color:#f59e0b}
.fav svg{width:22px;height:22px;display:block}

/* ============ sections ============ */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec-h h2 .ico{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--mrt-soft);color:var(--accent)}
.sec-h h2 .ico svg{width:14px;height:14px}
.sec-h p{margin:2px 0 0 32px;font-size:12px;color:var(--muted)}
.sec-h .aside{font-size:12px;color:var(--muted);white-space:nowrap}

/* MRT summary, grouped by line */
.line-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-items:start}
.line-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);border-radius:var(--r);padding:0 14px 4px}
.line-h{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-size:14px;font-weight:700}
.line-h>span:nth-child(2){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-h .muted{margin-left:auto;font-weight:500;font-size:12px}
.line-card.mine{opacity:.7}
.line-card.mine:hover{opacity:1}
.have-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:240px}
.have-chips button{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.have-chips button.on{border-color:var(--lc);color:var(--text);box-shadow:inset 0 0 0 1px var(--lc)}
.lp{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:16px;padding:0 4px;border-radius:5px;background:var(--lc);color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em;flex:none}
.mrow{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line);width:100%}
.mrow:hover .mrow-name .ellip{color:var(--mrt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mrow-name{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;font-weight:600}
.mrow-min{font-size:13px;font-weight:700}
.mrow-min small,.unit{font-weight:500;color:var(--muted);font-size:11px}
.mrow-bus{grid-column:2/4;font-size:12px;color:var(--muted)}
.mrow-bus b{color:var(--text);font-weight:600}
.mrt-tip .lps{display:inline-flex;gap:3px}

/* arrivals */
.arr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.arr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;width:100%;transition:border-color .15s,opacity .15s}
.arr:hover{border-color:var(--muted)}
.arr.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.arr.dim{opacity:.4}
.arr-dest b{display:block;font-size:14px}
.arr-dest small{display:flex;gap:5px;margin-top:4px;overflow:hidden}
.etas{display:flex;gap:10px;align-items:flex-start}
.eta{text-align:center;line-height:1}
.eta .m{font-weight:700;font-size:20px}
.eta.later .m{font-size:14px;font-weight:600;color:var(--muted)}
.eta.now .m{color:var(--live);font-size:16px;line-height:20px}
.eta .u{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.eta .ld{display:block;width:18px;height:3px;border-radius:2px;margin:4px auto 0}
.ld-SEA{background:var(--b10)}.ld-SDA{background:var(--b20)}.ld-LSD{background:#ef4444}

/* stops toolbar */
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .seg{flex:none}
.search-box{font-size:13px;flex:1;min-width:180px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;outline:none}
.search-box:focus{border-color:var(--accent)}
.chip{height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--mrt);border-color:var(--mrt);color:#fff}

/* per-bus columns */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.col-h{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);width:100%;border-radius:var(--r) var(--r) 0 0}
button.col-h:hover{background:var(--surface-2)}
.col-h > .ellip{flex:1}
.col-go{flex:none;display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--accent);background:var(--mrt-soft);white-space:nowrap}
.bcol{transition:opacity .15s}
.bcol.dim{opacity:.45}
.bcol.dim:hover{opacity:.8}
.bcol.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bcol.sel .col-go{background:var(--accent);color:#fff}
.col-h b{display:block;font-size:14px}
.col-h small{font-size:12px;color:var(--muted)}
.col-b{padding:6px 8px 8px}
.st{display:grid;grid-template-columns:52px 22px minmax(0,1fr);align-items:center;min-height:36px;border-radius:8px;width:100%}
.st[data-stop]:hover{background:var(--surface-2)}
.st .t{font-size:13px;font-weight:700;text-align:right;padding-right:8px;white-space:nowrap}
.st .rail{position:relative;align-self:stretch}
.st .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--c)}
.st:first-child .rail::before{top:50%}
.st:last-child .rail::before{bottom:50%}
.st .rail::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c)}
.st.home .rail::after{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--text);border-color:var(--text)}
.st .nm{display:flex;align-items:center;gap:6px;padding-left:8px;font-size:13px;min-width:0}
.st.mrt,.st.mrt[data-stop]:hover{background:var(--mrt-soft)}
.st.mrt .nm .ellip{color:var(--mrt);font-weight:700}
.st.far .t,.st.far .nm .ellip{color:var(--muted);font-weight:500}
.st.far.mrt .nm .ellip{color:var(--mrt);font-weight:600;opacity:.8}

/* by-time list */
.grp+.grp{margin-top:16px}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:14px;font-weight:700}
.grp-h .dot{width:10px;height:10px}
.grp-h span{font-size:12px;font-weight:500;color:var(--muted)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.row:last-child{border-radius:0 0 var(--r) var(--r)}
.row:hover{background:var(--surface-2)}
.row.mrt{background:var(--mrt-soft)}
.row.mrt .row-name{color:var(--mrt);font-weight:700}
.row .t{font-size:16px;font-weight:700;line-height:1}
.row .t small{display:block;font-family:inherit;font-size:11px;font-weight:500;color:var(--muted);margin-top:4px}
.row-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.row-sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:130px}

.note{margin-top:32px;padding:14px 16px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--muted)}
.note a{color:inherit}

/* ============ modals ============ */
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(2,6,23,.5);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{display:flex;flex-direction:column;width:100%;max-width:520px;max-height:84vh;overflow:hidden;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-h{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h h3{display:flex;align-items:center;margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheet-h h3 .btn{margin-left:auto}
.sheet-b{overflow-y:auto;padding:6px 8px 12px}
.picker{display:flex;gap:8px}
.picker input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;outline:none}
.picker input:focus{border-color:var(--accent)}
.picker .btn{height:auto}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:12px}
.res:hover{background:var(--surface-2)}
.res b{display:block;font-size:14px}
.res small{font-size:12px;color:var(--muted)}
.res .dist{margin-left:auto;font-size:12px;color:var(--muted)}
.lbl{padding:12px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:14px}
.set-row small{font-size:12px;color:var(--muted)}

/* ============ map overlays ============ */
.leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;min-width:200px}
.pop-h{font-size:14px;font-weight:700}
.pop-s{margin-bottom:8px;font-size:12px;color:var(--muted)}
.pop-r{display:flex;align-items:center;gap:8px;margin-top:5px}
.pop-r .t{margin-left:auto;font-weight:700}
.pop-a{display:inline-block;margin-top:10px;color:var(--accent);font-size:12px;font-weight:700;text-decoration:none}
.legend{position:absolute;left:12px;bottom:26px;z-index:500;min-width:176px;padding:10px 12px 8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.legend h4{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;font-size:13px;font-weight:600}
.legend button.off{opacity:.35}
.legend i{width:26px;height:6px;border-radius:3px;background:var(--c);flex:none}
.legend button.off i{background:var(--line)}
.legend .n{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.map-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:500;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.map-hint:empty{opacity:0}
.pop-svcs{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.pop-btn{display:block;width:100%;margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-align:center}
.pop-btn:hover{filter:brightness(1.08)}
.pop-btns{display:flex;gap:6px;margin-top:10px}
.pop-btns .pop-btn{margin-top:0;flex:1 1 auto;white-space:nowrap}
.pop-btn.ghost{background:var(--surface-2);color:var(--text)}
.pop-from{font-size:11px;color:var(--muted)}
.pick-dot{stroke:var(--muted);fill:var(--surface)}
.home-pin.off{width:20px;height:20px;margin:3px;background:var(--surface);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--muted),0 3px 8px rgba(0,0,0,.2)}
.home-mk{position:relative;width:26px;height:26px}
.home-pin{width:26px;height:26px;border-radius:50%;background:var(--text);border:4px solid var(--surface);box-shadow:0 0 0 3px var(--text),0 6px 16px rgba(0,0,0,.35)}
.home-lbl{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);padding:5px 10px;border-radius:9px;background:var(--text);color:var(--surface);font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.home-lbl::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--text)}
.home-lbl small{margin-left:5px;font-weight:500;opacity:.7}
.mrt-ring{width:22px;height:22px;padding:3px;border-radius:50%;border:3px solid var(--mrt);background:var(--surface);box-shadow:0 2px 8px rgba(29,78,216,.35)}
.mrt-ring i{display:block;width:10px;height:10px;border-radius:50%;background:var(--c)}
.mrt-ring.quiet{width:16px;height:16px;padding:2px;border-width:2px;box-shadow:none}
.mrt-ring.quiet i{width:8px;height:8px}
.leaflet-tooltip.mrt-tip{display:flex;align-items:center;gap:7px;padding:3px 9px 3px 3px;background:var(--surface);color:var(--text);border:2px solid var(--mrt);border-radius:11px;box-shadow:0 4px 14px rgba(29,78,216,.25);font:700 13px/1.2 "Plus Jakarta Sans",sans-serif;font-variant-numeric:tabular-nums}
.leaflet-tooltip.mrt-tip::before{display:none}
.leaflet-tooltip.mrt-tip.far{border-color:var(--line);box-shadow:none;color:var(--muted)}
.mrt-tip.far .ico{background:var(--muted)}

  .app{grid-template-columns:1fr;grid-template-rows:32vh minmax(0,1fr);grid-template-rows:32dvh minmax(0,1fr)}
  .panel{z-index:600;margin-top:-14px;border-left:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.12);overflow:hidden}

<body>
<div class="app">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="map-hint" id="mapHint"></div>
  </div>

  <aside class="panel">
    <header class="hdr">
      <div class="hdr-top">
        <div class="brand"><i></i>Bus Reach</div>
        <div class="hdr-actions">
          <button class="btn" id="btnRefresh" title="Refresh arrivals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
          <button class="btn" id="btnSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
          <button class="btn" id="btnStop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Change stop</button>

        </div>
        <button class="fav" id="btnFav" title="Save as favourite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg></button>

    <div class="scroll">
      <section class="sec">
        <div class="sec-h">

          <span class="aside" id="mrtAside"></span>

      <section class="sec">

          <input class="search-box" id="filter" placeholder="Filter stops: Mall, Blk 123, Bedok…">
          <button class="chip" id="btnMrt" title="Show only MRT station stops">MRT only</button>

</div>

<div class="modal" id="mStop">
  <div class="sheet">
    <div class="sheet-h">
      <h3><span id="mStopTitle">Choose a bus stop</span> <button class="btn" data-close>Close</button></h3>
      <div class="picker">
        <input id="q" placeholder="e.g. Bedok Stn, Tampines Ave 4, 75009" autocomplete="off">

<div class="modal" id="mSet">

    <div class="sheet-b" id="setBody"></div>

<script>
'use strict';

/* ============ config + state ============ */
const DATA = 'https://data.busrouter.sg/v1/';            // stops, services, route shapes
const ARRIVALS = 'https://arrivelah2.busrouter.sg/?id='; // live LTA arrivals
const TRAFFIC = { light: 30, normal: 24, heavy: 17 };     // bus cruise speed between stops, km/h
const DEFAULTS = { traffic: 'normal', dwell: 25, walk: 3, wait: true, haveLines: [] };  // haveLines: lines already near home (set in Settings), listed last
const LINE_ORDER = ['CC', 'NS', 'EW', 'TE', 'DT', 'NE', 'LRT'];
const BAND_VAR = ['--b10', '--b20', '--b30'];
const BAND_LABEL = ['Under 10 mins', '10 – 20 mins', '20 – 30 mins'];
// MRT/LRT stations per line, official line colours. Bus stop names abbreviate (Pk, Jln, W'lands…),
// so both sides are normalised before matching.
const MRT_LINES = {
  NS: { name: 'North-South Line', color: '#D42E12', st: 'Jurong East|Bukit Batok|Bukit Gombak|Choa Chu Kang|Yew Tee|Kranji|Marsiling|Woodlands|Admiralty|Sembawang|Canberra|Yishun|Khatib|Yio Chu Kang|Ang Mo Kio|Bishan|Braddell|Toa Payoh|Novena|Newton|Orchard|Somerset|Dhoby Ghaut|City Hall|Raffles Place|Marina Bay|Marina South Pier' },
  EW: { name: 'East-West Line', color: '#009645', st: 'Pasir Ris|Tampines|Simei|Tanah Merah|Bedok|Kembangan|Eunos|Paya Lebar|Aljunied|Kallang|Lavender|Bugis|City Hall|Raffles Place|Tanjong Pagar|Outram Park|Tiong Bahru|Redhill|Queenstown|Commonwealth|Buona Vista|Dover|Clementi|Jurong East|Chinese Garden|Lakeside|Boon Lay|Pioneer|Joo Koon|Gul Circle|Tuas Crescent|Tuas West Road|Tuas Link|Expo|Changi Airport' },
  NE: { name: 'North East Line', color: '#9900AA', st: 'HarbourFront|Outram Park|Chinatown|Clarke Quay|Dhoby Ghaut|Little India|Farrer Park|Boon Keng|Potong Pasir|Woodleigh|Serangoon|Kovan|Hougang|Buangkok|Sengkang|Punggol|Punggol Coast' },
  CC: { name: 'Circle Line', color: '#FA9E0D', st: 'Dhoby Ghaut|Bras Basah|Esplanade|Promenade|Nicoll Highway|Stadium|Mountbatten|Dakota|Paya Lebar|MacPherson|Tai Seng|Bartley|Serangoon|Lorong Chuan|Bishan|Marymount|Caldecott|Botanic Gardens|Farrer Road|Holland Village|Buona Vista|one-north|Kent Ridge|Haw Par Villa|Pasir Panjang|Labrador Park|Telok Blangah|HarbourFront|Keppel|Cantonment|Prince Edward Road|Bayfront|Marina Bay' },
  DT: { name: 'Downtown Line', color: '#005EC4', st: 'Bukit Panjang|Cashew|Hillview|Hume|Beauty World|King Albert Park|Sixth Avenue|Tan Kah Kee|Botanic Gardens|Stevens|Newton|Little India|Rochor|Bugis|Promenade|Bayfront|Downtown|Telok Ayer|Chinatown|Fort Canning|Bencoolen|Jalan Besar|Bendemeer|Geylang Bahru|Mattar|MacPherson|Ubi|Kaki Bukit|Bedok North|Bedok Reservoir|Tampines West|Tampines|Tampines East|Upper Changi|Expo' },
  TE: { name: 'Thomson-East Coast Line', color: '#9D5B25', st: 'Woodlands North|Woodlands|Woodlands South|Springleaf|Lentor|Mayflower|Bright Hill|Upper Thomson|Caldecott|Stevens|Napier|Orchard Boulevard|Orchard|Great World|Havelock|Outram Park|Maxwell|Shenton Way|Marina Bay|Gardens by the Bay|Tanjong Rhu|Katong Park|Tanjong Katong|Marine Parade|Marine Terrace|Siglap|Bayshore|Bedok South|Sungei Bedok' },
  LRT: { name: 'LRT', color: '#748477', st: 'South View|Keat Hong|Teck Whye|Phoenix|Bukit Panjang|Petir|Pending|Bangkit|Fajar|Segar|Jelapang|Senja|Compassvale|Rumbia|Bakau|Kangkar|Ranggung|Cheng Lim|Farmway|Kupang|Thanggam|Fernvale|Layar|Tongkang|Renjong|Cove|Meridian|Coral Edge|Riviera|Kadaloor|Oasis|Damai|Sam Kee|Teck Lee|Punggol Point|Samudera|Nibong|Sumang|Soo Teck' },
};
const ABBR = { pk: 'park', jln: 'jalan', bt: 'bukit', rd: 'road', st: 'street', ave: 'avenue', upp: 'upper', ctrl: 'central', gdns: 'gardens', gdn: 'garden', tg: 'tanjong', kg: 'kampong', lor: 'lorong', mt: 'mount', pde: 'parade', terr: 'terrace', blvd: 'boulevard', nth: 'north', sth: 'south', pl: 'place', hwy: 'highway', ctr: 'centre', res: 'reservoir', resvr: 'reservoir', cres: 'crescent', lk: 'link', pt: 'point', v: 'village', sq: 'square' };
const normStn = s => s.toLowerCase().replace(/c'wealth/g, 'commonwealth').replace(/w'lands/g, 'woodlands').replace(/s'goon/g, 'serangoon').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean).map(w => ABBR[w] || w).join('');
const STN_LINES = new Map();
for (const [code, l] of Object.entries(MRT_LINES)) for (const n of l.st.split('|')) { const k = normStn(n); STN_LINES.set(k, [...(STN_LINES.get(k) || []), code]); }
const LOAD = { SEA: 'Seats available', SDA: 'Standing', LSD: 'Limited standing' };

const ICONS = {
  mrt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4"/></svg>',
  bus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>',
  route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></svg>',
};

const store = {
  get(k, d){ try { const v = localStorage.getItem('busreach.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('busreach.' + k, JSON.stringify(v)); } catch {} },
};

const S = {
  stops: null, services: null, routes: null,     // network data
  sel: [], off: new Set(), code: null,            // chosen stops, the ones toggled off, first active stop
  arr: {}, fetchedAt: 0, err: null,               // live arrivals per stop
  reach: null, geomCache: new Map(),
  settings: { ...DEFAULTS, ...store.get('settings', {}) },
  favs: store.get('favs', []),
  bandOn: [true, true, true], tab: 'bus', filter: '', mrtOnly: false, focusSvc: null, popStation: null, pickMode: 'set',
};
const activeStops = () => S.sel.filter(c => !S.off.has(c));
const isMulti = () => activeStops().length > 1;

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = ms => new Date(ms).toLocaleTimeString('en-SG', { hour: 'numeric', minute: '2-digit' });
const mins = m => Math.round(m);
const stopName = c => S.stops?.[c]?.[2] ?? c;
const stopRoad = c => S.stops?.[c]?.[3] ?? '';
const stopLL = c => { const s = S.stops?.[c]; return s ? [s[1], s[0]] : null; };
const stationOf = name => name.replace(/\s*Stn\b.*$/i, '').split('/').pop().trim().replace(/^(Aft|Bef|Opp)\s+/i, '').trim() || name;
const linesOf = name => /\bStn\b/i.test(name) ? (STN_LINES.get(normStn(stationOf(name))) || []) : [];
const isMRT = name => linesOf(name).length > 0;    // excludes fire / police / petrol "Stn" stops
const linePill = code => `<span class="lp" style="--lc:${MRT_LINES[code].color}">${code}</span>`;
const linePills = name => linesOf(name).map(linePill).join('');
const isInt = name => /\b(Int|Ter)\b/i.test(name);
const bandOf = m => m <= 10 ? 0 : m <= 20 ? 1 : m <= 30 ? 2 : -1;
const bandColor = b => getComputedStyle(document.documentElement).getPropertyValue(BAND_VAR[b]).trim();
const opCls = op => 'op-' + (['SBST', 'SMRT', 'TTS', 'GAS'].includes(op) ? op : 'X');
const svcBadge = (no, op, sm) => `<span class="svc ${sm ? 'sm' : ''} ${opCls(op)}">${esc(no)}</span>`;
const pills = name => linePills(name) + (isInt(name) ? '<span class="pill int">INT</span>' : '');
const matchesFilter = c => {
  const f = S.filter.trim().toLowerCase();
  return (!f || `${stopName(c)} ${stopRoad(c)} ${c}`.toLowerCase().includes(f)) && (!S.mrtOnly || isMRT(stopName(c)));
};
function isDark(){
  const t = store.get('theme', 'auto');
  return t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function hav(a, b){
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ============ route geometry ============ */
function decodePolyline(str){
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length){
    for (let k = 0; k < 2; k++){
      let sh = 0, res = 0, b;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

// One service direction: road distance from the first stop to each stop, and the line segment
// each stop sits on. busrouter's polylines are simplified (a vertex every ~150 m), so stops are
// projected onto SEGMENTS rather than snapped to the nearest vertex.
function geom(no, dir){
  const key = no + '|' + dir;
  if (S.geomCache.has(key)) return S.geomCache.get(key);
  const seq = S.services[no].routes[dir];
  const enc = S.routes[no]?.[dir];
  const line = enc ? decodePolyline(enc) : null;
  const dist = [0], seg = [0];
  const fallback = i => { const a = stopLL(seq[i - 1]), b = stopLL(seq[i]); return a && b ? hav(a, b) * 1.3 : 400; };

  if (line && line.length > 1){
    const kx = Math.cos(line[0][0] * Math.PI / 180) * 111320, ky = 110540;   // local metres
    const P = line.map(([la, lo]) => [lo * kx, la * ky]);
    const cum = [0];
    for (let j = 1; j < P.length; j++) cum.push(cum[j - 1] + Math.hypot(P[j][0] - P[j - 1][0], P[j][1] - P[j - 1][1]));
    let k = 0, pos = 0;
    for (let i = 0; i < seq.length; i++){
      const ll = stopLL(seq[i]);
      if (!ll){ if (i){ dist.push(dist[i - 1] + 400); seg.push(k); } continue; }
      const q = [ll[1] * kx, ll[0] * ky];
      let bj = k, bt = 0, bd = Infinity;
      for (let j = k, end = Math.min(P.length - 1, k + 400); j < end; j++){   // forward only, so loops resolve in order
        const [ax, ay] = P[j], dx = P[j + 1][0] - ax, dy = P[j + 1][1] - ay;
        const t = Math.max(0, Math.min(1, ((q[0] - ax) * dx + (q[1] - ay) * dy) / (dx * dx + dy * dy || 1)));
        const d = Math.hypot(ax + t * dx - q[0], ay + t * dy - q[1]);
        if (d < bd - 0.5){ bd = d; bj = j; bt = t; }
      }
      const p = cum[bj] + bt * (cum[bj + 1] - cum[bj]);
      if (i === 0){ k = bj; pos = p; continue; }
      const straight = hav(stopLL(seq[i - 1]) || ll, ll);
      let road = p - pos;
      const ok = bd <= 200 && road >= straight * 0.9 && road <= straight * 4 + 800;
      if (ok){ k = bj; pos = p; } else road = fallback(i);
      dist.push(dist[i - 1] + road); seg.push(k);
    }
  } else {
    for (let i = 1; i < seq.length; i++){ dist.push(dist[i - 1] + fallback(i)); seg.push(null); }
  }
  const g = { seq, dist, seg, line };
  S.geomCache.set(key, g);
  return g;
}

// map path between two stops of one route: stop → road vertices → stop
function pathBetween(g, i, j){
  const a = stopLL(g.seq[i]), b = stopLL(g.seq[j]), ka = g.seg[i], kb = g.seg[j];
  if (!g.line || ka == null || kb == null || kb < ka) return [a, b];
  return [a, ...g.line.slice(ka + 1, kb + 1), b];
}

/* ============ reach model ============ */
function busesOf(svc){
  const seen = new Set();
  return [svc.next, svc.subsequent, svc.next2, svc.next3]
    .filter(b => b?.time && !seen.has(b.time) && seen.add(b.time))
    .sort((a, b) => new Date(a.time) - new Date(b.time));
}

// which direction (and which visit, for loop services) of the route this bus is on
function pickDirection(no, code, bus){
  const routes = S.services[no].routes, cands = [];
  routes.forEach((seq, d) => seq.forEach((c, i) => { if (c === code && i < seq.length - 1) cands.push({ d, i }); }));
  if (cands.length < 2) return cands[0] || null;
  const dest = bus?.destination_code;
  const same = dest ? cands.filter(c => routes[c.d].at(-1) === dest) : [];
  const pool = same.length ? same : cands;
  return pool[Math.min(bus?.visit_number || 1, pool.length) - 1];
}

function computeReach(){
  const from = activeStops().filter(c => S.arr[c]);
  if (!from.length || !S.services) return null;
  const now = Date.now();
  const { traffic, dwell, walk, wait } = S.settings;
  const mps = TRAFFIC[traffic] / 3.6;
  const perSvc = [], perStop = new Map();

  for (const code of from) for (const svc of S.arr[code].services || []){
    const buses = busesOf(svc);
    if (!S.services[svc.no] || !buses.length) continue;
    // the bus you'd actually catch after walking to the stop
    const bus = wait ? buses.find(b => new Date(b.time) - now >= walk * 60000) : buses[0];
    if (!bus){ perSvc.push({ svc, from: code, stops: [] }); continue; }
    const dir = pickDirection(svc.no, code, bus);
    if (!dir) continue;
    const g = geom(svc.no, dir.d);
    const waitSec = wait ? Math.max(0, (new Date(bus.time) - now) / 1000) : 0;
    const stops = [];
    for (let j = dir.i + 1; j < g.seq.length; j++){
      const ride = (g.dist[j] - g.dist[dir.i]) / mps + dwell * (j - dir.i);
      const total = (waitSec + ride) / 60;
      const e = { code: g.seq[j], idx: j, ride: ride / 60, total, band: bandOf(total), no: svc.no, op: svc.operator, from: code };
      stops.push(e);                 // whole route to the terminus
      if (e.band < 0) continue;      // only ≤30 min counts as "reach"
      const cur = perStop.get(e.code);
      if (cur) cur.all.push(e); else perStop.set(e.code, { code: e.code, all: [e] });
    }
    perSvc.push({ svc, from: code, bus, dir, g, waitMin: waitSec / 60, stops });
  }
  perSvc.sort((a, b) => (a.waitMin ?? 99) - (b.waitMin ?? 99));
  return { perSvc, perStop, at: now };
}

// reachable stops, respecting the bus focus (and optionally the bands + filter)
function reachable({ filtered = false } = {}){
  if (!S.reach) return [];
  const out = [];
  for (const v of S.reach.perStop.values()){
    const all = S.focusSvc ? v.all.filter(e => e.no === S.focusSvc) : v.all;
    if (!all.length) continue;
    const best = all.reduce((a, b) => a.total < b.total ? a : b);
    if (filtered && (!S.bandOn[best.band] || !matchesFilter(v.code))) continue;
    out.push({ code: v.code, best, all: all.slice().sort((a, b) => a.total - b.total) });
  }
  return out.sort((a, b) => a.best.total - b.best.total);
}
const uniqueBuses = entries => [...new Map(entries.map(e => [e.no, e])).values()];   // entries sorted fastest first

/* ============ render: header ============ */
function renderHeader(){
  const act = activeStops(), c = act.length === 1 ? act[0] : null;
  $('#hCode').textContent = c || (act.length ? `${act.length} stops` : '—');
  $('#hName').textContent = c ? stopName(c) : act.length ? act.map(stopName).join(' + ') : 'Pick your bus stop';
  $('#hSub').textContent = c ? stopRoad(c) : act.length ? 'Fastest bus from any of these stops' : 'Search by name, road or 5-digit code, or tap a stop on the map';
  $('#btnFav').classList.toggle('on', !!c && S.favs.includes(c));
  $('#btnFav').style.visibility = c ? 'visible' : 'hidden';
  document.title = act.length ? `${c ? stopName(c) : act.length + ' stops'} · Bus Reach` : 'Bus Reach SG';
  $('#stopChips').innerHTML = S.sel.map(code => {
    const off = S.off.has(code);
    return `<span class="schip ${off ? 'off' : ''}"><button data-toggle-stop="${code}" title="${off ? 'Include' : 'Leave out'} ${esc(stopName(code))}"><i></i><span class="code">${code}</span><span class="ellip">${esc(stopName(code))}</span></button>${S.sel.length > 1 ? `<button class="x" data-remove-stop="${code}" title="Remove this stop">×</button>` : ''}</span>`;
  }).join('') + (S.sel.length ? `<button class="schip add" data-add-stop title="Add another stop to compare">+ Add stop</button>` : '');
}

function renderStatus(){
  const el = $('#status');
  if (S.err){ el.innerHTML = `<span style="color:#ef4444">${esc(S.err)}</span>`; return; }
  if (!S.fetchedAt){ el.textContent = S.code ? 'Loading…' : ''; return; }
  const ago = Math.round((Date.now() - S.fetchedAt) / 1000);
  el.textContent = `Updated ${ago < 5 ? 'just now' : ago + 's ago'}`;
}

/* ============ render: MRT summary (grouped by line) ============ */
function renderMrt(){
  const box = $('#mrtList');
  if (!S.reach){ box.innerHTML = `<div class="card empty">${S.code ? 'Loading…' : 'Choose a stop to begin'}</div>`; $('#mrtAside').textContent = ''; return; }
  const stations = new Map();   // station name -> { lines, best, entries }
  for (const r of reachable()){
    const nm = stopName(r.code), lines = linesOf(nm);
    if (!lines.length) continue;
    const key = stationOf(nm);
    const st = stations.get(key) || { name: key, lines, best: r.best, entries: [] };
    if (r.best.total < st.best.total) st.best = r.best;
    st.entries.push(...r.all);
    stations.set(key, st);
  }
  $('#mrtAside').textContent = stations.size ? `${stations.size} stations` : '';
  if (!stations.size){ box.innerHTML = `<div class="card empty">No MRT stations within 30 min on the buses arriving now.</div>`; return; }

  const row = (st, line) => {
    const buses = uniqueBuses(st.entries.slice().sort((a, b) => a.total - b.total));
    const shown = buses.slice(0, 4).map(e => `<b>${esc(e.no)}</b> ${mins(e.total)} min`).join(' · ') + (buses.length > 4 ? ` · +${buses.length - 4}` : '');
    const others = st.lines.filter(l => l !== line).map(linePill).join('');
    return `<button class="mrow" data-stop="${st.best.code}" style="--c:${bandColor(st.best.band)}" title="${esc(buses.map(e => `${e.no} in ${mins(e.total)} min${isMulti() ? ` from ${stopName(e.from)}` : ''}`).join(', '))}">
      <span class="dot"></span><span class="mrow-name"><span class="ellip">${esc(st.name)}</span>${others}</span><span class="mrow-min">${mins(st.best.total)}<small> min</small></span>
      <span class="mrow-bus ellip">${shown}</span></button>`;
  };
  const all = [...stations.values()].sort((a, b) => a.best.total - b.best.total);
  const have = S.settings.haveLines || [];
  const order = [...LINE_ORDER.filter(c => !have.includes(c)), ...LINE_ORDER.filter(c => have.includes(c))];   // new lines first
  box.innerHTML = order.map(code => {
    const l = MRT_LINES[code], list = all.filter(st => st.lines.includes(code));
    if (!list.length) return '';
    const mine = have.includes(code);
    return `<div class="line-card ${mine ? 'mine' : ''}" style="--lc:${l.color}">
      <div class="line-h">${linePill(code)}<span>${l.name}</span>${mine ? '<span class="have">near home</span>' : ''}<span class="muted">${list.length}</span></div>
      ${list.map(st => row(st, code)).join('')}</div>`;
  }).join('');
}

/* ============ render: arrivals ============ */
function etaHTML(b, first){
  const m = Math.floor((new Date(b.time) - Date.now()) / 60000);
  return `<div class="eta ${first ? '' : 'later'} ${m <= 0 ? 'now' : ''}">
    <span class="m">${m <= 0 ? 'Now' : m}</span>${first ? `<span class="u">${m <= 0 ? '&nbsp;' : 'min'}</span>` : ''}
    <span class="ld ld-${esc(b.load)}" title="${LOAD[b.load] || ''}"></span></div>`;
}

function renderArrivals(){
  const box = $('#arrivals');
  if (!S.code){ box.innerHTML = `<div class="empty">No stop selected. <button class="btn" data-open-stop>Choose a bus stop</button></div>`; return; }
  const act = activeStops(), multi = act.length > 1;
  box.innerHTML = act.map(code => {
    const head = multi ? `<div class="arr-stop"><span class="code">${code}</span>${esc(stopName(code))}<span class="muted">${esc(stopRoad(code))}</span></div>` : '';
    return head + (S.arr[code] ? arrivalsHTML(S.arr[code]) : `<div class="empty">Loading…</div>`);
  }).join('');
}

function arrivalsHTML(data){
  const first = svc => busesOf(svc)[0];
  const svcs = (data.services || []).filter(first).sort((a, b) => new Date(first(a).time) - new Date(first(b).time));
  if (!svcs.length) return `<div class="empty">No buses in operation at this stop right now.</div>`;
  return `<div class="arr-grid">` + svcs.map(svc => {
    const bs = busesOf(svc), b0 = bs[0];
    const dest = b0.destination_code ? stopName(b0.destination_code) : (S.services[svc.no]?.name || '');
    const tags = [b0.type === 'DD' && 'Double deck', b0.type === 'BD' && 'Bendy', b0.feature === 'WAB' && '♿', b0.monitored === 0 && 'Scheduled']
      .filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');
    const cls = S.focusSvc === svc.no ? 'sel' : S.focusSvc ? 'dim' : '';
    return `<button class="card arr ${cls}" data-svc="${esc(svc.no)}">
      ${svcBadge(svc.no, svc.operator)}
      <div class="arr-dest ellip"><b class="ellip">to ${esc(dest)}</b><small>${tags}</small></div>
      <div class="etas">${bs.slice(0, 3).map((b, i) => etaHTML(b, i === 0)).join('')}</div>
    </button>`;
  }).join('') + `</div>`;
}

/* ============ render: stops along the way ============ */
function renderStops(){
  const s = S.settings;
  $('#stopsSub').textContent = `Estimated minutes from now${s.wait ? `, incl. ${s.walk} min walk + wait` : ' (from boarding)'}`;
  const v = $('#view');
  if (!S.reach){ v.innerHTML = ''; return; }
  v.innerHTML = S.tab === 'time' ? byTimeHTML() : byBusHTML();
}

function byBusHTML(){
  const color = b => b >= 0 && S.bandOn[b] ? `var(${BAND_VAR[b]})` : 'var(--line)';
  const cols = S.reach.perSvc.map(p => {
    const no = p.svc.no;
    const dest = p.bus?.destination_code ? stopName(p.bus.destination_code) : (S.services[no]?.name || '');
    const on = S.focusSvc === no, cls = `card bcol ${on ? 'sel' : S.focusSvc ? 'dim' : ''}`;
    const head = sub => p.bus
      ? `<button class="col-h" data-svc="${esc(no)}" title="${on ? 'Show all buses' : `Show bus ${esc(no)}'s route on the map`}">${svcBadge(no, p.svc.operator)}<div class="ellip"><b class="ellip">to ${esc(dest)}</b><small>${sub}</small></div><span class="col-go">${on ? 'On map ✕' : 'Route'}</span></button>`
      : `<div class="col-h">${svcBadge(no, p.svc.operator)}<div class="ellip"><b class="ellip">to ${esc(dest)}</b><small>${sub}</small></div></div>`;
    if (!p.bus) return `<div class="${cls}">${head('No bus you can catch soon')}</div>`;
    const nMrt = new Set(p.stops.map(e => stopName(e.code)).filter(isMRT).map(stationOf)).size;
    const rows = p.stops.filter(e => matchesFilter(e.code)).map(e => {
      const nm = stopName(e.code);
      return `<button class="st ${isMRT(nm) ? 'mrt' : ''} ${e.band < 0 ? 'far' : ''}" style="--c:${color(e.band)}" data-stop="${e.code}" title="${esc(stopRoad(e.code))} · ${e.code} · arrive ${clock(S.reach.at + e.total * 60000)}">
        <span class="t">${mins(e.total)}<span class="unit"> min</span></span><span class="rail"></span>
        <span class="nm"><span class="ellip">${esc(nm)}</span>${pills(nm)}</span></button>`;
    }).join('');
    return `<div class="${cls}">
      ${head(`${isMulti() ? `From ${esc(stopName(p.from))} · ` : ''}Catch in ${mins(p.waitMin)} min · ${p.stops.length} stops · ${nMrt} MRT`)}
      <div class="col-b">
        <div class="st home" style="--c:${p.stops[0] ? color(p.stops[0].band) : 'var(--line)'}"><span class="t">${mins(p.waitMin)}<span class="unit"> min</span></span><span class="rail"></span><span class="nm"><span class="ellip"><b>${isMulti() ? `Board at ${esc(stopName(p.from))}` : 'Board here'}</b> · ${clock(new Date(p.bus.time))}</span></span></div>
        ${rows || '<div class="empty" style="padding:12px">No matching stops</div>'}
      </div></div>`;
  });
  return cols.length ? `<div class="cols">${cols.join('')}</div>` : `<div class="empty">No routes.</div>`;
}

function byTimeHTML(){
  const rows = reachable({ filtered: true });
  if (!rows.length) return `<div class="empty">No stops match.</div>`;
  return [0, 1, 2].map(b => {
    const rs = rows.filter(r => r.best.band === b);
    if (!rs.length) return '';
    return `<div class="grp"><div class="grp-h"><span class="dot" style="--c:var(${BAND_VAR[b]})"></span>${BAND_LABEL[b]}<span>${rs.length} stops</span></div><div class="card">` +
      rs.map(r => {
        const nm = stopName(r.code);
        return `<button class="row ${isMRT(nm) ? 'mrt' : ''}" data-stop="${r.code}">
          <span class="t">${mins(r.best.total)}<span class="unit"> min</span><small>${clock(S.reach.at + r.best.total * 60000)}</small></span>
          <span class="ellip"><span class="row-name"><span class="ellip">${esc(nm)}</span>${pills(nm)}</span><span class="row-sub ellip" style="display:block">${esc(stopRoad(r.code))} · ${r.code}</span></span>
          <span class="chips">${uniqueBuses(r.all).slice(0, 4).map(e => svcBadge(e.no, e.op, true)).join('')}</span>
        </button>`;
      }).join('') + `</div></div>`;
  }).join('');
}

function renderNote(){
  const s = S.settings;
  $('#note').innerHTML = `<b>How times are worked out.</b> Arrivals at your stop are live from LTA DataMall (via arrivelah).
    Times to later stops are <b>estimates</b>: road distance along the route at ${TRAFFIC[s.traffic]} km/h (${s.traffic} traffic)
    plus ${s.dwell}s per stop${s.wait ? `, starting from the first bus you can catch after a ${s.walk}-min walk` : ', counted from boarding'}.
    Change these in Settings. Route data: <a href="https://busrouter.sg" target="_blank" rel="noopener">busrouter.sg</a>.`;
}

/* ============ map ============ */
let map, tiles, layer, pickLayer, svcsAt;
const PICK_ZOOM = 15;
const markers = new Map();

function initMap(){
  map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 12);
  L.control.zoom({ position: 'topright' }).addTo(map);
  // every bus stop in view, as a quiet tappable dot under the routes
  map.createPane('pick').style.zIndex = 390;
  pickLayer = L.layerGroup().addTo(map);
  layer = L.layerGroup().addTo(map);
  map.on('moveend zoomend', renderPickStops);
  setTiles();
}

// services that call at each stop (built once, on first use)
function servicesAt(code){
  if (!svcsAt){
    svcsAt = new Map();
    for (const [no, sv] of Object.entries(S.services || {}))
      for (const dir of sv.routes || []) for (const c of dir){
        const a = svcsAt.get(c) || svcsAt.set(c, []).get(c);
        if (!a.includes(no)) a.push(no);
      }
    for (const a of svcsAt.values()) a.sort((x, y) => parseInt(x) - parseInt(y) || x.localeCompare(y));
  }
  return svcsAt.get(code) || [];
}

// the choose / add / toggle buttons for any stop popup
function stopActions(code){
  if (S.sel.includes(code)){
    const off = S.off.has(code);
    return `<div class="pop-btns"><button class="pop-btn ${off ? '' : 'ghost'}" data-toggle-stop="${code}">${off ? 'Include this stop' : 'Leave this stop out'}</button>` +
      (S.sel.length > 1 ? `<button class="pop-btn ghost" data-remove-stop="${code}">Remove</button>` : '') + `</div>`;
  }
  return `<div class="pop-btns"><button class="pop-btn" data-goto="${code}">Board here instead</button><button class="pop-btn ghost" data-add-code="${code}">+ Add stop</button></div>`;
}

function pickPopupHTML(code){
  const nm = stopName(code), svcs = servicesAt(code);
  return `<div class="pop-h">${esc(nm)} ${pills(nm)}</div><div class="pop-s">${esc(stopRoad(code))} · ${code}</div>` +
    (svcs.length ? `<div class="pop-svcs">${svcs.slice(0, 18).map(no => svcBadge(no, S.services[no]?.operator || 'X', true)).join('')}${svcs.length > 18 ? `<span class="muted">+${svcs.length - 18}</span>` : ''}</div>` : '') +
    stopActions(code);
}

function renderPickStops(){
  if (!map || !S.stops) return;
  pickLayer.clearLayers();
  const z = map.getZoom(), hint = $('#mapHint');
  if (z < PICK_ZOOM){ hint.textContent = 'Zoom in to pick bus stops on the map'; return; }
  hint.textContent = '';
  const b = map.getBounds().pad(0.1);
  for (const [code, s] of Object.entries(S.stops)){
    if (S.sel.includes(code) || markers.has(code)) continue;     // chosen and reachable stops have their own markers
    const ll = [s[1], s[0]];
    if (!b.contains(ll)) continue;
    L.circleMarker(ll, { pane: 'pick', radius: z >= 17 ? 6 : 4.5, color: '#64748b', weight: 1.5, fillColor: '#fff', fillOpacity: 1, className: 'pick-dot' })
      .bindTooltip(esc(stopName(code)), { direction: 'top', offset: [0, -4] })
      .bindPopup(() => pickPopupHTML(code), { closeButton: false })
      .addTo(pickLayer);
  }
}

// OneMap (Singapore Land Authority) basemap: free, no key
function setTiles(){
  if (!map) return;
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(`https://www.onemap.gov.sg/maps/tiles/${isDark() ? 'Night' : 'Grey'}/{z}/{x}/{y}.png`, {
    minZoom: 11, maxZoom: 19, detectRetina: true,
    attribution: '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:14px;width:14px;vertical-align:-3px"> <a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a> &copy; contributors | <a href="https://www.sla.gov.sg/" target="_blank" rel="noopener">Singapore Land Authority</a>',
  }).addTo(map);
}

function renderMap(fit){
  if (!map) return;
  layer.clearLayers(); markers.clear();
  renderLegend();
  if (!S.sel.length) return renderPickStops();
  const act = activeStops();
  const bounds = L.latLngBounds((act.length ? act : S.sel).map(stopLL));

  if (S.reach){
    // route lines, coloured by the band of the stop each piece arrives at;
    // slowest drawn first so the fastest way along a shared road sits on top
    const segs = [], far = [], farStops = [];
    for (const p of S.reach.perSvc){
      if (!p.bus || (S.focusSvc && p.svc.no !== S.focusSvc)) continue;
      let prev = p.dir.i;
      for (const e of p.stops){
        const pts = pathBetween(p.g, prev, e.idx);
        if (S.bandOn[e.band]) segs.push({ pts, band: e.band, total: e.total });
        else if (S.focusSvc && e.band < 0){ far.push(pts); farStops.push(e); }
        if (S.focusSvc) for (const pt of pts) bounds.extend(pt);
        prev = e.idx;
      }
    }
    segs.sort((a, b) => b.total - a.total);
    const style = { lineCap: 'round', lineJoin: 'round', interactive: false };
    // the part of the picked bus's route beyond 30 min: grey and dashed, with its stops
    for (const pts of far) L.polyline(pts, { ...style, color: '#fff', weight: 8, opacity: .8 }).addTo(layer);
    for (const pts of far) L.polyline(pts, { ...style, color: '#94a3b8', weight: 4.5 }).addTo(layer);
    const nearBoard = ll => act.some(c => map.distance(stopLL(c), ll) < 900);   // loop routes come back past home: keep that clear
    const farLabelled = new Set();
    for (const e of farStops){
      const ll = stopLL(e.code), nm = stopName(e.code);
      if (!ll) continue;
      L.circleMarker(ll, { radius: isInt(nm) ? 6 : 4, color: '#fff', weight: 1.5, fillColor: '#94a3b8', fillOpacity: 1 }).addTo(layer)
        .bindTooltip(`${mins(e.total)} min · ${esc(nm)}`, { direction: 'top', offset: [0, -6] })
        .bindPopup(() => pickPopupHTML(e.code), { closeButton: false });
      const stn = isMRT(nm) ? stationOf(nm) : null;
      if (!stn || farLabelled.has(stn) || nearBoard(ll)) continue;
      farLabelled.add(stn);
      L.tooltip({ permanent: true, direction: 'right', offset: [8, 0], className: 'mrt-tip far', interactive: false })
        .setLatLng(ll).setContent(`<span class="ico">${ICONS.mrt}</span>${esc(stn)}<span class="lps">${linePills(nm)}</span><span class="min">${mins(e.total)} min</span>`).addTo(layer);
    }
    for (const s of segs) L.polyline(s.pts, { ...style, color: '#fff', weight: 10, opacity: .9 }).addTo(layer);
    for (const s of segs) L.polyline(s.pts, { ...style, color: bandColor(s.band), weight: 6 }).addTo(layer);

    const stops = reachable().filter(r => S.bandOn[r.best.band]);
    const labelled = new Set();
    for (const r of stops){
      const ll = stopLL(r.code), nm = stopName(r.code);
      if (!ll) continue;
      bounds.extend(ll);
      const m = L.circleMarker(ll, { radius: isInt(nm) ? 7.5 : 5.5, color: '#fff', weight: 2, fillColor: bandColor(r.best.band), fillOpacity: 1 }).addTo(layer);
      m.bindPopup(() => popupHTML(r), { closeButton: false });
      m.bindTooltip(`${mins(r.best.total)} min · ${esc(nm)}`, { direction: 'top', offset: [0, -6] });
      markers.set(r.code, m);

      // one prominent label per MRT station, on its earliest stop
      const stn = stationOf(nm);
      if (!isMRT(nm) || labelled.has(stn)) continue;
      labelled.add(stn);
      const c = bandColor(r.best.band);
      // all routes shown: a quiet ring. One bus picked, or the station clicked: the full label pops.
      const pop = !!S.focusSvc || S.popStation === stn;
      const size = pop ? 22 : 16;
      L.marker(ll, { icon: L.divIcon({ className: '', html: `<div class="mrt-ring ${pop ? '' : 'quiet'}"><i style="--c:${c}"></i></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }), zIndexOffset: 500, interactive: false }).addTo(layer);
      if (pop) L.tooltip({ permanent: true, direction: 'right', offset: [12, 0], className: 'mrt-tip', interactive: false })
        .setLatLng(ll).setContent(`<span class="ico">${ICONS.mrt}</span>${esc(stn)}<span class="lps">${linePills(nm)}</span><span class="min" style="--c:${c}">${mins(r.best.total)} min</span>`).addTo(layer);
      else m.setTooltipContent(`<b>${esc(stn)}</b> ${linePills(nm)} · ${mins(r.best.total)} min`);
    }
  }

  // chosen stops: a "Board here" pin for each one in use, a hollow pin for each one left out
  for (const code of S.sel){
    const off = S.off.has(code);
    const lbl = off ? '' : `<div class="home-lbl">${act.length > 1 ? '' : 'Board here'}<small>${esc(code)}</small></div>`;
    L.marker(stopLL(code), {
      icon: L.divIcon({ className: '', html: `<div class="home-mk">${lbl}<div class="home-pin ${off ? 'off' : ''}"></div></div>`, iconSize: [26, 26], iconAnchor: [13, 13] }),
      zIndexOffset: off ? 900 : 1000,
    }).bindTooltip(esc(stopName(code)) + (off ? ' · left out' : ''), { direction: 'bottom', offset: [0, 12] })
      .bindPopup(() => pickPopupHTML(code), { closeButton: false }).addTo(layer);
  }
  renderPickStops();

  if (fit) map.fitBounds(bounds.pad(0.08), { maxZoom: 15, animate: false });
}

function renderLegend(){
  const n = [0, 0, 0];
  for (const r of reachable()) n[r.best.band]++;
  $('#legend').innerHTML = `<h4>Time from Board here</h4>` + BAND_LABEL.map((l, i) =>
    `<button class="${S.bandOn[i] ? '' : 'off'}" data-band="${i}" style="--c:var(${BAND_VAR[i]})"><i></i>${l}<span class="n">${n[i]}</span></button>`).join('');
}

function popupHTML(r){
  return `<div class="pop-h">${esc(stopName(r.code))}</div><div class="pop-s">${esc(stopRoad(r.code))} · ${r.code}</div>` +
    uniqueBuses(r.all).map(e => `<div class="pop-r">${svcBadge(e.no, e.op, true)}<span class="muted">${mins(e.ride)} min ride${isMulti() ? `<span class="pop-from"> from ${e.from}</span>` : ''}</span><span class="t">${mins(e.total)} min · ${clock(S.reach.at + e.total * 60000)}</span></div>`).join('') +
    stopActions(r.code);
}

function showStopOnMap(code){
  const ll = stopLL(code); if (!ll) return;
  const nm = stopName(code), stn = isMRT(nm) ? stationOf(nm) : null;
  if (stn !== S.popStation){ S.popStation = stn; renderMap(false); }
  map.setView(ll, Math.max(map.getZoom(), 15));
  const m = markers.get(code);
  if (m) m.openPopup();
  else L.popup({ closeButton: false }).setLatLng(ll).setContent(`<div class="pop-h">${esc(stopName(code))}</div><div class="pop-s">${esc(stopRoad(code))} · ${code} · beyond 30 min</div>`).openOn(map);
}

/* ============ data + refresh ============ */
async function loadNetwork(){
  const day = Math.floor(Date.now() / 864e5);   // refresh the network once a day
  const get = n => fetch(`${DATA}${n}.min.json?d=${day}`).then(r => { if (!r.ok) throw new Error(`${n} ${r.status}`); return r.json(); });
  [S.stops, S.services, S.routes] = await Promise.all(['stops', 'services', 'routes'].map(get));
}

async function fetchArrivals(){
  const codes = S.sel.slice();
  if (!codes.length) return;
  const res = await Promise.allSettled(codes.map(c => fetch(ARRIVALS + c, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(`arrivals ${c} ${r.status}`); return r.json(); })));
  let ok = 0;
  res.forEach((r, i) => {
    if (r.status === 'fulfilled' && S.sel.includes(codes[i])){ S.arr[codes[i]] = r.value; ok++; }
    else if (r.status === 'rejected') console.warn(r.reason);
  });
  if (ok) S.fetchedAt = Date.now();
  S.err = ok === codes.length ? null : 'Live arrivals unavailable, retrying';
  refresh(true);
}

// recompute the model and redraw the panel (and the map, when asked)
function refresh(redrawMap, fit){
  S.reach = computeReach();
  renderMrt(); renderArrivals(); renderStops(); renderStatus(); renderNote();
  if (redrawMap) renderMap(fit);
}

// the set of chosen stops changed: save it, redraw, and (optionally) fetch arrivals again
function stopsChanged(refetch = true, fit = true){
  S.code = activeStops()[0] || null;
  Object.assign(S, { focusSvc: null, popStation: null, err: null });
  document.querySelector('.app').classList.remove('focus');
  store.set('sel', S.sel); store.set('off', [...S.off]);
  const u = new URL(location.href);
  if (S.sel.length) u.searchParams.set('stop', S.sel.join(',')); else u.searchParams.delete('stop');
  history.replaceState(null, '', u);
  closeModals(); renderHeader(); refresh(true, fit);
  if (refetch) fetchArrivals().then(() => renderMap(fit));
}
const remember = code => store.set('recent', [code, ...store.get('recent', []).filter(c => c !== code)].slice(0, 6));

function setStop(code){                       // replace every chosen stop with this one
  if (!S.stops[code]) return;
  Object.assign(S, { sel: [code], off: new Set(), arr: {}, fetchedAt: 0 });
  remember(code); stopsChanged();
}
function addStop(code){                       // compare one more stop
  if (!S.stops[code]) return;
  if (S.sel.includes(code)){ S.off.delete(code); return stopsChanged(false, false); }
  S.sel.push(code); remember(code); stopsChanged(true, false);   // keep the map where it is
}
function toggleStop(code){
  if (S.off.has(code)) S.off.delete(code);
  else if (activeStops().length > 1) S.off.add(code);
  else return;                                // keep at least one stop in use
  stopsChanged(false, false);
}
function removeStop(code){
  if (S.sel.length < 2) return;
  S.sel = S.sel.filter(c => c !== code); S.off.delete(code); delete S.arr[code];
  if (!activeStops().length) S.off.clear();
  stopsChanged(false, false);
}

/* ============ stop picker ============ */
const resItem = (c, extra = '') => `<button class="res" data-pick="${c}"><span class="code">${c}</span><div class="ellip"><b class="ellip">${esc(stopName(c))}</b><small>${esc(stopRoad(c))}</small></div>${extra}</button>`;

function renderPicker(){
  const box = $('#qRes'), q = $('#q').value.trim().toLowerCase();
  if (!S.stops){ box.innerHTML = '<div class="empty">Loading stops…</div>'; return; }
  if (!q){
    const favs = S.favs.filter(c => S.stops[c]);
    const recent = store.get('recent', []).filter(c => S.stops[c] && !favs.includes(c));
    box.innerHTML = (favs.length ? `<div class="lbl">★ Favourites</div>${favs.map(c => resItem(c)).join('')}` : '') +
      (recent.length ? `<div class="lbl">Recent</div>${recent.map(c => resItem(c)).join('')}` : '') ||
      `<div class="empty">Type a stop name, road or code,<br>or tap <b>Near me</b> to find the stop by your house.</div>`;
    return;
  }
  const words = q.split(/\s+/), hits = [];
  for (const [c, s] of Object.entries(S.stops)){
    if (words.every(w => `${c} ${s[2]} ${s[3]}`.toLowerCase().includes(w))) hits.push(c);
    if (hits.length > 60) break;
  }
  hits.sort((a, b) => b.startsWith(q) - a.startsWith(q));
  box.innerHTML = hits.length ? hits.slice(0, 40).map(c => resItem(c)).join('') : '<div class="empty">No stops found.</div>';
}

function nearMe(){
  const box = $('#qRes');
  if (!navigator.geolocation){ box.innerHTML = '<div class="empty">Location isn\'t available in this browser.</div>'; return; }
  box.innerHTML = '<div class="empty">Finding stops near you…</div>';
  navigator.geolocation.getCurrentPosition(pos => {
    const me = [pos.coords.latitude, pos.coords.longitude];
    const near = Object.keys(S.stops).map(c => [c, hav(me, stopLL(c))]).sort((a, b) => a[1] - b[1]).slice(0, 10);
    const fmt = d => d < 1000 ? `${Math.round(d)} m` : `${(d / 1000).toFixed(1)} km`;
    box.innerHTML = `<div class="lbl">Nearest stops</div>` + near.map(([c, d]) => resItem(c, `<span class="dist">${fmt(d)}</span>`)).join('');
  }, err => { box.innerHTML = `<div class="empty">Couldn't get your location (${esc(err.message)}).<br>Search by name instead.</div>`; },
  { enableHighAccuracy: true, timeout: 10000 });
}

function openStop(mode = 'set'){ S.pickMode = mode; $('#mStopTitle').textContent = mode === 'add' ? 'Add another bus stop' : 'Choose a bus stop'; $('#mStop').classList.add('on'); $('#q').value = ''; renderPicker(); setTimeout(() => $('#q').focus(), 50); }
function closeModals(){ document.querySelectorAll('.modal').forEach(m => m.classList.remove('on')); }

/* ============ settings + theme ============ */
function segHTML(key, opts, cur = S.settings[key]){
  return `<div class="seg" data-set="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
function renderSettings(){
  const row = (title, sub, ctl) => `<div class="set-row"><div><b>${title}</b><small>${sub}</small></div>${ctl}</div>`;
  $('#setBody').innerHTML =
    row('Traffic', 'Bus speed between stops', segHTML('traffic', [['light', 'Light'], ['normal', 'Normal'], ['heavy', 'Heavy']])) +
    row('Time at each stop', 'Boarding and alighting', segHTML('dwell', [[15, '15s'], [25, '25s'], [40, '40s']])) +
    row('Count the wait', 'Start the clock now, not when you board', segHTML('wait', [[true, 'Yes'], [false, 'No']])) +
    row('Walk to the stop', 'Skips buses you can\'t make', segHTML('walk', [[0, '0'], [3, '3m'], [5, '5m'], [8, '8m']])) +
    row('Lines near home', 'Listed last, so new lines stand out', `<div class="have-chips">${LINE_ORDER.map(c => `<button data-have="${c}" style="--lc:${MRT_LINES[c].color}" class="${(S.settings.haveLines || []).includes(c) ? 'on' : ''}">${linePill(c)}</button>`).join('')}</div>`) +
    row('Theme', 'Follows your device by default', segHTML('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], store.get('theme', 'auto')));
}
function applyTheme(){
  const t = store.get('theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  setTiles(); renderMap(false);
}

/* ============ events ============ */
function toggleBand(i){
  S.bandOn[i] = !S.bandOn[i];
  if (!S.bandOn.some(Boolean)) S.bandOn[i] = true;   // never hide everything
  refresh(true);
}

document.addEventListener('click', e => {
  const t = e.target, on = sel => t.closest(sel);
  let el;
  if (on('[data-close]') || t.classList.contains('modal')) return closeModals();
  if (on('[data-open-stop]')) return openStop();
  if ((el = on('[data-pick]'))) { const c = el.dataset.pick; if (S.pickMode !== 'add') return setStop(c); addStop(c); return map.setView(stopLL(c), Math.max(map.getZoom(), 15)); }
  if ((el = on('[data-add-code]'))){ map.closePopup(); return addStop(el.dataset.addCode); }
  if ((el = on('[data-toggle-stop]'))){ map.closePopup(); return toggleStop(el.dataset.toggleStop); }
  if ((el = on('[data-remove-stop]'))){ map.closePopup(); return removeStop(el.dataset.removeStop); }
  if (on('[data-add-stop]')) return openStop('add');
  if ((el = on('[data-goto]'))){ e.preventDefault(); map.closePopup(); return setStop(el.dataset.goto); }
  if ((el = on('[data-svc]'))){
    S.focusSvc = S.focusSvc === el.dataset.svc ? null : el.dataset.svc;
    document.querySelector('.app').classList.toggle('focus', !!S.focusSvc);
    map.invalidateSize();
    return refresh(true, true);
  }
  if ((el = on('[data-band]'))) return toggleBand(+el.dataset.band);
  if ((el = on('#tabs [data-t]'))){
    S.tab = el.dataset.t;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === el));
    return renderStops();
  }
  if ((el = on('[data-stop]'))) return showStopOnMap(el.dataset.stop);
  if (on('#btnMrt')){ S.mrtOnly = !S.mrtOnly; $('#btnMrt').classList.toggle('on', S.mrtOnly); return renderStops(); }
  if ((el = on('[data-have]'))){
    const c = el.dataset.have, h = S.settings.haveLines || [];
    S.settings.haveLines = h.includes(c) ? h.filter(x => x !== c) : [...h, c];
    store.set('settings', S.settings); renderSettings(); return renderMrt();
  }
  if ((el = on('[data-set] button'))){
    const key = el.parentElement.dataset.set, raw = el.dataset.v;
    if (key === 'theme'){ store.set('theme', raw); renderSettings(); return applyTheme(); }
    S.settings[key] = raw === 'true' ? true : raw === 'false' ? false : isNaN(+raw) ? raw : +raw;
    store.set('settings', S.settings); renderSettings(); return refresh(true);
  }
});
$('#btnStop').onclick = () => openStop('set');
$('#btnSettings').onclick = () => { renderSettings(); $('#mSet').classList.add('on'); };
$('#btnRefresh').onclick = fetchArrivals;
$('#btnNear').onclick = nearMe;
$('#btnFav').onclick = () => {
  if (!S.code) return;
  S.favs = S.favs.includes(S.code) ? S.favs.filter(c => c !== S.code) : [S.code, ...S.favs];
  store.set('favs', S.favs); renderHeader();
};
$('#q').addEventListener('input', renderPicker);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') $('#qRes [data-pick]')?.click(); });
$('#filter').addEventListener('input', e => { S.filter = e.target.value; renderStops(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModals();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); openStop('set'); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchArrivals(); });

/* ============ boot ============ */
(async function boot(){
  document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = ICONS[el.dataset.ico]; });
  initMap(); applyTheme();
  renderHeader(); refresh(false);
  try { await loadNetwork(); }
  catch (e){ console.warn(e); S.err = 'Could not load the bus network. Check your connection and reload.'; return renderStatus(); }
  const fromUrl = (new URLSearchParams(location.search).get('stop') || '').split(',').filter(c => S.stops[c]);
  const saved = store.get('sel', null) || [store.get('last', null)];
  S.sel = [...new Set(fromUrl.length ? fromUrl : saved.filter(c => S.stops[c]))];
  S.off = new Set(fromUrl.length ? [] : store.get('off', []).filter(c => S.sel.includes(c)));
  if (!activeStops().length) S.off.clear();
  if (S.sel.length) stopsChanged(); else { renderMap(); openStop(); }
  setInterval(() => { if (!document.hidden) fetchArrivals(); }, 30000);  // live arrivals
  setInterval(() => { if (S.fetchedAt) refresh(false); }, 10000);              // countdowns drift
  setInterval(renderStatus, 1000);
})();
</script>
</body>
